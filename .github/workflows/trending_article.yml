name: "TrendingWeekly"

# 每周六 06:00（北京时间）= 每周五 22:00 UTC
# 注意：cron 一律按 UTC 计算，改本地时区设置不会生效；GitHub 高峰期可能延迟数分钟到十几分钟
on:
  schedule:
    - cron: "0 22 * * 5"
  # 支持手动触发（Actions 页面 Run workflow），方便改完立刻验证
  workflow_dispatch:
    inputs:
      ping:
        description: "自检：验飞书通道 + DeepSeek 模型/Key 连通性（不抓榜单）"
        type: boolean
        default: false
      dry_run:
        description: "只跑抓取和解析，不调模型、不推送（打印卡片预览）"
        type: boolean
        default: false
      top:
        description: "指定取榜单第几名；留空或填 0 = 由模型从候选池里自主选题（推荐）"
        type: string
        default: "0"
      candidates:
        description: "候选池大小（仅 --top=0 自主选题时生效）"
        type: string
        default: "12"
      since:
        description: "榜单周期"
        type: choice
        default: "weekly"
        options:
          - weekly
          - daily
          - monthly

# 内容只推飞书、不再向仓库回写任何文件，读权限即可
permissions:
  contents: read

# 避免上一次没跑完就叠一次
concurrency:
  group: trending-weekly
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 脚本只用标准库（urllib），无需 pip install 任何依赖
      - name: "Generate weekly article and push to Feishu"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 官方 base_url 不带 /v1；模型默认锁定 deepseek-flash（DeepSeek-V4.1-Flash）
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          # 一般不用设；设了会覆盖默认模型并跳过可用性核对
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # 选题要横向比较并权衡"读者用不用得上"，推文要消化成可读的推广文——都需要思考模式。
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || '1' }}
          # 飞书自建应用机器人（推荐通道）：以下三项齐全才会启用
          FEISHU_GITHUB_ACTION_APP_ID: ${{ secrets.FEISHU_GITHUB_ACTION_APP_ID }}
          FEISHU_GITHUB_ACTION_APP_SECRET: ${{ secrets.FEISHU_GITHUB_ACTION_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          # 可选，默认 chat_id；也可填 open_id / user_id / email
          FEISHU_RECEIVE_ID_TYPE: ${{ vars.FEISHU_RECEIVE_ID_TYPE }}
          # 兜底通道：没配应用凭证时回退到自定义机器人 webhook（只能发卡片，发不了源文件）
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGN_KEY: ${{ secrets.FEISHU_SIGN_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.ping }}" = "true" ]; then
            echo "run: python Trending/trending_article.py --ping"
            python Trending/trending_article.py --ping
            exit $?
          fi
          ARGS="--since ${{ github.event.inputs.since || 'weekly' }} --top ${{ github.event.inputs.top || '0' }} --candidates ${{ github.event.inputs.candidates || '12' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "run: python Trending/trending_article.py $ARGS"
          python Trending/trending_article.py $ARGS
