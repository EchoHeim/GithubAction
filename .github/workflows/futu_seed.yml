name: 富途种子

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [master]
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 1-23/2 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: 🛒 Checkout
        uses: actions/checkout@v2

      - name: 🔎 Check IP
        run: curl https://api.ipify.org

      # Runs a single command using the runners shell
      - name: 🌠 Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: 3.10.*

      - name: 💈 Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ./ChromeSelenium/requirements.txt

      - name: ⏳ Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: 🪴 Configuration Environment
        run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 & # optional

      - name: 🎐 Working
        continue-on-error: true
        run: |
          echo "chrome: $(google-chrome --version 2>/dev/null || google-chrome-stable --version 2>/dev/null || echo 'chrome not found')"
          echo "chromedriver: $(chromedriver --version 2>/dev/null || echo 'chromedriver not found')"
          python -B -m ChromeSelenium.Futu.SeedFarm ${{ secrets.FUTU_USERNAME }} ${{ secrets.FUTU_PASSWORD }} ${{ secrets.FEISHU_BOT_ID }} && echo "PY_OK=true" >> $GITHUB_ENV || echo "PY_FAILED=true" >> $GITHUB_ENV

      - name: 📦 Upload debug artifacts
        if: always() && env.PY_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: futu-debug
          path: |
            /tmp/futu_*.png
            /tmp/futu_*.html
          if-no-files-found: ignore

      - name: 🚨 Fail if python failed
        if: env.PY_FAILED == 'true'
        run: exit 1
