name: 网站签到

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # push:
  #   branches: [ master ]
  schedule:
    - cron: "22 22 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      site:
        description: Site to run
        required: true
        default: all
        type: choice
        options:
          - all
          - coarcade
          - joinquant
          - fishpi

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v5

      # Runs a single command using the runners shell
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10.*

      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r ./ChromeSelenium/requirements.txt

      - name: Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: Check in Coarcade
        if: ${{ github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == 'coarcade' }}
        env:
          CHECKIN_USERNAME: ${{ secrets.COARCADE_NAME }}
          CHECKIN_PASSWORD: ${{ secrets.COARCADE_PASSWD }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID }}
        run: |
          uname -a
          python -B -m ChromeSelenium.Check-in.coarcade "$CHECKIN_USERNAME" "$CHECKIN_PASSWORD" "$FEISHU_BOT_ID"

      - name: Check in JoinQuant
        if: ${{ always() && (github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == 'joinquant') }}
        env:
          CHECKIN_USERNAME: ${{ secrets.JQ_USERNAME }}
          CHECKIN_PASSWORD: ${{ secrets.JQ_PASSWORD }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID }}
        run: python -B -m ChromeSelenium.Check-in.JoinQuant "$CHECKIN_USERNAME" "$CHECKIN_PASSWORD" "$FEISHU_BOT_ID"

      - name: Check in FishPi
        if: ${{ always() && (github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == 'fishpi') }}
        env:
          CHECKIN_USERNAME: ${{ secrets.FISHPI_USERNAME }}
          CHECKIN_PASSWORD: ${{ secrets.FISHPI_PASSWORD }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID }}
        run: python -B -m ChromeSelenium.Check-in.fishpi "$CHECKIN_USERNAME" "$CHECKIN_PASSWORD" "$FEISHU_BOT_ID"
