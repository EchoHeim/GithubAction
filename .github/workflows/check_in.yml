name: 网站签到

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # push:
  #   branches: [ master ]
  schedule:
    - cron: "22 22 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      site:
        description: Site to run
        required: true
        default: all
        type: choice
        options:
          - all
          - v2ex
          - 52pojie
          - juejin

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # 20 → 45：新增 52pojie / 掘金 两步。两步各自带 10 分钟上限，
    # 加上 V2EX 的 12 分钟和环境准备，45 分钟留了余量。
    timeout-minutes: 45

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v5

      # Runs a single command using the runners shell
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10.*

      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r ./ChromeSelenium/requirements.txt

      - name: Install system libs
        # opencv-python 需要 libGL，无头 Linux runner 上缺它会 import cv2 直接失败
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 xvfb

      - name: Prepare chromedriver
        uses: nanasess/setup-chromedriver@v2

      # JoinQuant 签到已移到本机跑，见 ChromeSelenium/Check-in/LOCAL_RUN.md。
      # GitHub 托管 runner 出口 IP 在海外，会被聚宽的地区风控直接拦掉
      # （页面返回「当前地区暂不支持访问」，登录接口 405 + 非 JSON），改代码没用 —— 别再把它加回来。

      # FishPi 已禁用（2026-09-26）。它单跑要 30 分钟 —— fishpi.py:111-140 有 6 次聊天发言，
      # 每次后面跟一个 time.sleep(300)，是整个 job 耗时的大头。
      # 要恢复就把下面的 `if: false` 换回原条件：
      # ${{ always() && (github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == 'fishpi') }}
      - name: Check in FishPi
        if: false
        env:
          CHECKIN_USERNAME: ${{ secrets.FISHPI_USERNAME }}
          CHECKIN_PASSWORD: ${{ secrets.FISHPI_PASSWORD }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID }}
        run: python -B -m ChromeSelenium.Check-in.fishpi "$CHECKIN_USERNAME" "$CHECKIN_PASSWORD" "$FEISHU_BOT_ID"

      - name: Check in V2EX
        if: ${{ always() && (github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == 'v2ex') }}
        timeout-minutes: 12
        env:
          V2EX_USERNAME: ${{ secrets.V2EX_USERNAME }}
          V2EX_PASSWORD: ${{ secrets.V2EX_PASSWORD }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID }}
        run: python -B -m ChromeSelenium.Check-in.v2ex "$V2EX_USERNAME" "$V2EX_PASSWORD" "$FEISHU_BOT_ID"

      # V2EX 靠验证码 OCR + 重试，失败原因从日志里看不全。把现场（验证码原图、
      # 失败页 DOM、截图、页面提示文案）传成 artifact，排查不用再靠猜。
      - name: Upload V2EX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2ex-debug
          path: v2ex-debug/
          if-no-files-found: ignore
          retention-days: 7

      # 52pojie 的任务页被自家 wzws WAF 保护（图片验证码，脚本用 ddddocr 过），
      # 而**登录页有人机验证（Cloudflare Turnstile），自动化过不去** —— 所以凭据用登录态
      # Cookie（PJ52_COOKIE），跳过登录页。用户名/密码作为兜底保留，但脚本会快失败并提示。
      # Cookie 失效时（Discuz 会话约一个月）去浏览器重新登录后再抄一次。
      - name: Check in 52pojie
        if: ${{ always() && (github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == '52pojie') }}
        timeout-minutes: 10
        # 只用 Cookie 登录（密码登录已移除：登录页是 Cloudflare Turnstile，本机线路到不了它）。
        # 因此不需要 xvfb/有头模式，无头更稳。
        env:
          PJ52_COOKIE: ${{ secrets.PJ52_COOKIE || vars.PJ52_COOKIE }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID || vars.FEISHU_BOT_ID }}
        run: python -B -m ChromeSelenium.Check-in.52pojie

      # 掘金与 52pojie 同理：密码登录会被字节系风控要求「抖音 APP 扫码验身」，
      # 自动化走不通 —— 凭据用登录态 Cookie（JUEJIN_COOKIE），跳过登录页。
      # ⚠️ 凭据同时兼容两种存放位置：Secrets 优先，其次 Variables（有人会存在 Variables 里，
      #    而 `secrets.X` 取不到 → 现象是「账号传进来了、密码却是空的」）。
      - name: Check in JueJin
        if: ${{ always() && (github.event_name == 'schedule' || inputs.site == 'all' || inputs.site == 'juejin') }}
        timeout-minutes: 15
        env:
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE || vars.JUEJIN_COOKIE }}
          JUEJIN_USERNAME: ${{ secrets.JUEJIN_USERNAME || vars.JUEJIN_USERNAME }}
          # 注意：这个仓库里掘金的 secret 实际叫 JUEJIN_PASSWD（少个 OR）—— 两种拼写都兼容，
# 免得改名/改名不同步时又出现「用户名有值、密码 0 字」这种看不见的坑。
          JUEJIN_PASSWORD: ${{ secrets.JUEJIN_PASSWD || secrets.JUEJIN_PASSWORD || vars.JUEJIN_PASSWD || vars.JUEJIN_PASSWORD }}
          FEISHU_BOT_ID: ${{ secrets.FEISHU_BOT_ID || vars.FEISHU_BOT_ID }}
          # 字节验证码对无头很敏感 → 用 xvfb 虚拟显示器跑**有头**模式（base.py 认这个开关）
          CHECKIN_HEADLESS: "0"
        run: xvfb-run -a python -B -m ChromeSelenium.Check-in.juejin

      - name: Upload 52pojie / JueJin diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-sites-debug
          path: |
            52pojie-debug/
            juejin-debug/
          if-no-files-found: ignore
          retention-days: 7
